name: Deploy to Screeps

on:
    push:
        branches-ignore:
            - template
        paths:
            - "src/**"
            - "scripts/**"
            - "vite.config.ts"
            - "package.json"
            - "tsconfig.json"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: screeps-deploy-${{ github.ref }}
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-24.04
        timeout-minutes: 10

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.4"

            - name: Install dependencies
              run: bun install

            - name: Lint
              run: bun run lint

            - name: Type check
              run: bunx tsc --noEmit

            - name: Build and deploy
              env:
                  SCREEPS_TOKEN: ${{ secrets.SCREEPS_TOKEN }}
                  SCREEPS_BRANCH: ${{ github.ref_name == 'main' && 'default' || github.ref_name }}

              run: bun run deploy
